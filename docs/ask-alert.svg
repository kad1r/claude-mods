<svg xmlns="http://www.w3.org/2000/svg" width="961" height="330" viewBox="0 0 961 330">
<rect width="100%" height="100%" rx="10" fill="#0d1117"/>
<text x="20" y="26" font-family="'Cascadia Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#6e7681">ask-alert · a permission prompt in the terminal, the same moment on the Windows desktop</text>
<rect x="20" y="44" width="560" height="170" rx="8" fill="#0b0f14" stroke="#30363d"/>
<text x="34" y="70" font-family="'Cascadia Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#c9d1d9" font-weight="bold">Bash command</text>
<text x="34" y="96" font-family="'Cascadia Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#c9d1d9" xml:space="preserve">  git push origin main</text>
<text x="34" y="124" font-family="'Cascadia Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#c9d1d9">Do you want to proceed?</text>
<text x="34" y="148" font-family="'Cascadia Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#58a6ff" xml:space="preserve">❯ 1. Yes</text>
<text x="34" y="168" font-family="'Cascadia Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#c9d1d9" xml:space="preserve">  2. Yes, and don't ask again for git push commands</text>
<text x="34" y="188" font-family="'Cascadia Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#c9d1d9" xml:space="preserve">  3. No, and tell Claude what to do differently</text>
<rect x="20" y="230" width="560" height="46" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="34" y="249" font-family="'Cascadia Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#6e7681">toast · ask-alert</text>
<text x="34" y="268" font-family="'Cascadia Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#c9d1d9" xml:space="preserve">Claude onay bekliyor: Claude needs your permission to use Bash</text>
<text x="20" y="306" font-family="'Cascadia Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#e3b341" xml:space="preserve">♪ Windows Notify System Generic.wav</text>
